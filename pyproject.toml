[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nfse-validator"
version = "1.0.0"
description = "Validador offline de XML de NFS-e para devs que precisam testar antes de pagar um provedor"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["nfs-e", "nota-fiscal", "xml", "validator", "brasil", "iss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SEU-USUARIO/nfse-validator"
Issues = "https://github.com/SEU-USUARIO/nfse-validator/issues"

[project.scripts]
nfse-validator = "nfse_validator.cli:main"

[tool.setuptools.packages.find]
include = ["nfse_validator*"]
